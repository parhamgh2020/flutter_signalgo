name: signalgo
description: "SignalGo — cryptocurrency market analysis, powered by a self-hosted Appwrite backend."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Backend
  appwrite: ^25.4.0

  # Charts
  fl_chart: ^0.69.2

  # Localization
  intl: ^0.20.2
  shamsi_date: ^1.1.0

  # Fonts
  google_fonts: ^6.2.1

  # Local storage
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Connectivity (Realtime reconnect / offline banner)
  connectivity_plus: ^6.1.0

  # Backend health ping (Settings > About)
  http: ^1.2.2

  # News detail: share + open-original
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

  # Settings > About: app version
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
